name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create release ZIP
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Use a tag such as v0.0.1.'
          }
          $version = [IO.File]::ReadAllText((Join-Path $PWD 'VERSION')).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'VERSION must contain a version such as 0.0.1.'
          }
          if ($tag -cne "v$version") {
            throw "Release tag $tag does not match VERSION ($version)."
          }
          $files = @(
            'GoWEDayTextSelector.cmd',
            'VERSION',
            'LanguageSelector\GearsLanguageSelector.ps1',
            'LanguageSelector\LanguageCore.ps1',
            'LanguageSelector\GameProfile.ps1',
            'LanguageSelector\UiMessages.ps1',
            'README.md'
          )
          $stageRoot = Join-Path $env:RUNNER_TEMP ('GoWEDayTextSelector-' + [guid]::NewGuid().ToString('N'))
          $stage = Join-Path $stageRoot 'GoWEDayTextSelector'
          [void][IO.Directory]::CreateDirectory((Join-Path $stage 'LanguageSelector'))
          foreach ($file in $files) {
            $source = Join-Path $PWD $file
            if (-not [IO.File]::Exists($source)) { throw "Missing file: $file" }
            if ($file.EndsWith('.ps1')) {
              $bytes = [IO.File]::ReadAllBytes($source)
              if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
                throw "UTF-8 BOM required for Windows PowerShell 5.1: $file"
              }
              $tokens = $null
              $errors = $null
              $null = [Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) { throw ($errors | Out-String) }
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $stage $file)
          }
          [void][IO.Directory]::CreateDirectory((Join-Path $PWD 'dist'))
          Compress-Archive -LiteralPath $stage -DestinationPath ".\dist\GoWEDayTextSelector_$tag.zip" -CompressionLevel Optimal -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if (-not $releaseExists) {
            gh release create $env:RELEASE_TAG --repo $env:GH_REPO --verify-tag --title $env:RELEASE_TAG --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          $asset = ".\dist\GoWEDayTextSelector_$($env:RELEASE_TAG).zip"
          gh release upload $env:RELEASE_TAG $asset --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
